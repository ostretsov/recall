[package]
name = "recall"
version = "0.1.0"
description = "Call recorder with live subtitles for Ubuntu"
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
chrono = "0.4.45"
gst = { version = "0.25.4", package = "gstreamer" }
libc = "0.2"
gst_app = { version = "0.25.2", package = "gstreamer-app" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_6"] }
recall-core = { version = "0.1.0", path = "../core" }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.5.0"
vosk = "0.3.1"
whisper-rs = { version = "0.16.0", features = ["vulkan"] }
x11rb = "0.14.0"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
